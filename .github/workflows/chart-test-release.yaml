name: Chart Test and Release

on:
  push:
    branches:
      - master
      - "release/*"
    paths:
      - "chart/**"
      - ".github/workflows/chart-test-release.yaml"
  pull_request:
    branches: [master]
    paths:
      - "chart/**"
      - ".github/workflows/chart-test-release.yaml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run helm unittest
        uses: d3adb5/helm-unittest-action@v2.5.0
        with:
          helm-version: 'v3.21.0'  # see https://github.com/d3adb5/helm-unittest-action/issues/23
          unittest-version: 'v1.0.3'  # see https://github.com/helm-unittest/helm-unittest/issues/856
          charts: chart

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add dependency repos
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Lint chart
        run: ct lint --target-branch master --charts chart --helm-lint-extra-args '-f chart/tests/test.values.yaml'

  test-in-minikube:
    needs: [unittest, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@v0.0.21

      - name: Install the chart using test values
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          kubectl create secret generic gf-secret --from-literal=JWT_SECRET_KEY=$(openssl rand -hex 24) --from-literal=ACCESS_TOKEN_SALT=$(openssl rand -hex 24)
          kubectl create secret generic valkey-secret --from-literal=default=$(openssl rand -hex 24)
          pgpassword=$(openssl rand -hex 24)
          kubectl create secret generic pg-secret --from-literal=postgres-password="$pgpassword" --from-literal=uri="postgresql://ghostfolio-user:$pgpassword@ghostfolio-postgres:5432/ghostfolio-db"
          helm dependency build chart
          helm upgrade --install ghostfolio chart -f chart/tests/test.values.yaml
          echo "Waiting for pods to become ready"
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/instance=ghostfolio --timeout=300s

      - name: Smoke-test the Ghostfolio API (user signup)
        run: |
          set -euo pipefail
          BASE_URL=http://localhost:3334
          kubectl port-forward svc/ghostfolio 3334:80 >/tmp/pf.log 2>&1 &
          pf_pid=$!
          trap 'kill $pf_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -Ssf "${BASE_URL}/api/v1/health" >/dev/null 2>&1 && break
            sleep 1
          done

          curl -Ssf "${BASE_URL}/api/v1/info" | tee info.json | jq -e '.'

          signup_response=$(curl -Ssf -X POST "${BASE_URL}/api/v1/user")
          echo "${signup_response}" | tee signup.json | jq -e '.authToken and .accessToken and .role'

          auth_token=$(jq -r .authToken signup.json)
          access_token=$(jq -r .accessToken signup.json)
          role=$(jq -r .role signup.json)

          test "${role}" = "ADMIN"
          test -n "${auth_token}"
          test -n "${access_token}"

          curl -Ssf -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/user" | tee user.json | jq -e '.id'

          # User-setting persistence: PUT then re-read and confirm it stuck.
          curl -Ssf -X PUT \
            -H "Authorization: Bearer ${auth_token}" \
            -H "Content-Type: application/json" \
            -d '{"baseCurrency":"EUR"}' \
            "${BASE_URL}/api/v1/user/setting" >/dev/null
          curl -Ssf -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/user" | jq -e '.settings.settings.baseCurrency == "EUR"'

          # Platform round-trip: write, read, delete.
          platform_name="ci-test-platform-$$"
          curl -Ssf -X POST \
            -H "Authorization: Bearer ${auth_token}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${platform_name}\",\"url\":\"https://example.com\"}" \
            "${BASE_URL}/api/v1/platform" | tee platform.json | jq -e '.id'
          platform_id=$(jq -r .id platform.json)
          curl -Ssf -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/platform" | jq -e --arg n "${platform_name}" '.platforms | map(select(.name == $n)) | length == 1'
          curl -Ssf -X DELETE -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/platform/${platform_id}"

          # Account round-trip: write, read, delete.
          account_name="ci-test-account-$$"
          curl -Ssf -X POST \
            -H "Authorization: Bearer ${auth_token}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${account_name}\",\"currency\":\"EUR\",\"balance\":0,\"platformId\":null}" \
            "${BASE_URL}/api/v1/account" | tee account.json | jq -e '.id'
          account_id=$(jq -r .id account.json)
          curl -Ssf -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/account" | jq -e --arg n "${account_name}" '.accounts | map(select(.name == $n)) | length == 1'
          curl -Ssf -X DELETE -H "Authorization: Bearer ${auth_token}" \
            "${BASE_URL}/api/v1/account/${account_id}"

          curl -Ssf "${BASE_URL}/api/v1/health" | jq -e '.status == "OK"'

      - name: Upload API test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghostfolio-api-test-logs
          path: |
            signup.json
            info.json
            user.json
            platform.json
            account.json
            /tmp/pf.log
          if-no-files-found: ignore

  release:
    needs: [unittest, lint, test-in-minikube]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard against stable release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          version=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          if [[ "$version" != *-* ]]; then
            echo "::error::Stable version '$version' not allowed on a release branch. Use a pre-release version (e.g. 1.0.0-rc.1)."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add dependency repos
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build dependencies and prep release
        run: |
          helm dependency build chart
          cp README.md LICENSE chart/

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: "."
          mark_as_latest: ${{ github.ref == 'refs/heads/master' }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
